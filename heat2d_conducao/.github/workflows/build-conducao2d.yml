name: Build Conducao2D_DEQ-UEM (Windows exe)

# Este workflow assume que o projeto vive numa SUBPASTA do repositório
# (ex.: chemical_engineering/heat2d_conducao/), não na raiz. Por isso:
#   - o nome do workflow, das tags e dos artefatos é único (prefixo
#     "conducao2d-"), para não colidir com outros apps/builds do mesmo repo
#   - todos os passos "run" usam working-directory apontando pra subpasta
#   - o filtro "paths" faz o push só disparar o build se algo dentro
#     da subpasta mudar (não roda à toa quando você mexe em outro projeto)
#
# Dispara:
#   1) automaticamente ao empurrar uma tag "conducao2d-vX.Y.Z"
#   2) manualmente pela aba Actions (workflow_dispatch), a qualquer momento

on:
  push:
    tags:
      - "conducao2d-v*"
    paths:
      - "heat2d_conducao/**"
  workflow_dispatch: {}

defaults:
  run:
    working-directory: heat2d_conducao

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Compilar executável (PyInstaller)
        run: pyinstaller heat2d.spec --noconfirm

      - name: Renomear artefato com a versão da tag
        shell: bash
        run: |
          VERSAO="${GITHUB_REF_NAME:-manual}"
          mkdir -p dist_final
          cp "dist/Conducao2D_DEQ-UEM.exe" "dist_final/Conducao2D_DEQ-UEM_${VERSAO}.exe"

      - name: Publicar artefato do build
        uses: actions/upload-artifact@v4
        with:
          name: Conducao2D_DEQ-UEM-Windows
          path: heat2d_conducao/dist_final/*.exe
          retention-days: 90

      - name: Criar Release do GitHub (apenas em push de tag conducao2d-v*)
        if: startsWith(github.ref, 'refs/tags/conducao2d-v')
        uses: softprops/action-gh-release@v2
        with:
          files: heat2d_conducao/dist_final/*.exe
          name: "Condução de Calor 2D ${{ github.ref_name }}"
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
